<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Hacking Terminal</title>
 <style>
:root {
 --bg-color: #050505;
 --term-color: #00ff41;
 --term-dim: #008F11;
 --error-color: #ff3333;
 --accent-color: #ff9900;
 --font-stack: 'Courier New', Courier, monospace;
 }

 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 }

 body {
 background-color: var(--bg-color);
 color: var(--term-color);
 font-family: var(--font-stack);
 height: 100vh;
 overflow: hidden;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 }

 /* --- Terminal Screen --- */
 #terminal-container {
 width: 90%;
 max-width: 600px;
 height: 80vh;
 border: 2px solid var(--term-dim);
 border-radius: 10px;
 padding: 20px;
 position: relative;
 box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
 display: flex;
 flex-direction: column;
 transition: opacity 0.5s ease;
 }

.terminal-header {
 border-bottom: 1px solid var(--term-dim);
 padding-bottom: 10px;
 margin-bottom: 15px;
 display: flex;
 justify-content: space-between;
 font-size: 0.9rem;
 text-transform: uppercase;
 }

 #output {
 flex-grow: 1;
 overflow-y: auto;
 font-size: 1.1rem;
 line-height: 1.4;
 white-space: pre-wrap;
 }

.line {
 margin-bottom: 5px;
 opacity: 0;
 animation: fadeIn 0.1s forwards;
 }

.error { color: var(--error-color); }
.success { color: #fff; font-weight: bold; }
.loading { color: var(--term-dim); }
.warning { color: var(--accent-color); }

.cursor {
 display: inline-block;
 width: 10px;
 height: 1.2rem;
 background-color: var(--term-color);
 animation: blink 1s step-end infinite;
 vertical-align: middle;
 }

 /* --- Admin Panel --- */
 #admin-panel {
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 background: rgba(0, 20, 0, 0.98);
 border: 2px solid var(--term-color);
 padding: 30px;
 border-radius: 8px;
 width: 85%;
 max-width: 400px;
 z-index: 100;
 display: none;
 text-align: center;
 box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
 }

 #admin-panel.active { display: block; }

.admin-input {
 width: 100%;
 padding: 12px;
 margin: 10px 0;
 background: #000;
 border: 1px solid var(--term-dim);
 color: var(--term-color);
 font-family: var(--font-stack);
 font-size: 1rem;
 outline: none;
 }

.btn {
 padding: 12px 24px;
 margin: 5px;
 border: none;
 cursor: pointer;
 font-family: var(--font-stack);
 font-weight: bold;
 font-size: 1rem;
 transition: all 0.2s;
 }

.unlock-btn {
 background: var(--term-dim);
 color: #000;
 }

.unlock-btn:hover { background: var(--term-color); }

.kick-btn {
 background: var(--error-color);
 color: #fff;
 width: 100%;
 margin-top: 15px;
 animation: pulse 1.5s infinite;
 }

.kick-btn:hover { background: #cc0000; }

.admin-msg {
 margin-top: 15px;
 font-size: 0.9rem;
 min-height: 20px;
 }

 /* --- Animations --- */
 @keyframes blink { 50% { opacity: 0; } }
 @keyframes fadeIn { to { opacity: 1; } }
 @keyframes pulse {
 0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
 70% { box-shadow: 0 0 0 10px rgba(255, 51, 51, 0); }
 100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
 }

 #focus-indicator {
 position: absolute;
 bottom: 10px;
 right: 10px;
 font-size: 0.8rem;
 color: var(--term-dim);
 opacity: 0.7;
 }
 </style>
</head>
<body>

 <div id="terminal-container">
 <div class="terminal-header">
 <span>root@system:~</span>
 <span>v5.2.0</span>
 </div>
 <div id="output"></div>
 <div id="focus-indicator">System Active</div>
 </div>

 <!-- Admin Panel -->
 <div id="admin-panel">
 <h3 style="margin-bottom: 15px; color: #fff;">ADMIN CONSOLE</h3>
 
 <div id="login-section">
 <p style="margin-bottom: 10px; font-size: 0.9rem;">
 Enter password to unlock:
 </p>
 <input type="password" id="admin-pass" class="admin-input" placeholder="Password" onkeypress="handleEnter(event)">
 <button class="btn unlock-btn" onclick="checkAdmin()">Unlock</button>
 <p id="admin-msg" class="admin-msg"></p>
 </div>

 <div id="control-section" style="display: none;">
 <p style="color: #fff; margin-bottom: 10px;">Terminal Unlocked.</p>
 <p style="font-size: 0.9rem; margin-bottom: 15px;">
 Click below to forcefully kick the user out.
 </p>
 <button class="btn kick-btn" onclick="kickOut()">⚠️ KICK OUT ⚠️</button>
 </div>
 </div>

 <script>
 // --- Configuration ---
 const ADMIN_PASSWORD = "admin";
 const URL_PARAM = "wllx";
 
 // --- State ---
 let isUnlocked = false;
 let isKicked = false;
 let isTyping = false;
 
 // --- Elements ---
 const outputDiv = document.getElementById('output');
 const adminPanel = document.getElementById('admin-panel');
 const passInput = document.getElementById('admin-pass');
 const adminMsg = document.getElementById('admin-msg');
 const loginSection = document.getElementById('login-section');
 const controlSection = document.getElementById('control-section');

 // --- Terminal Logs Database ---
 const logs = [
 "Initializing kernel...",
 "Mounting virtual file system...",
 "Bypassing firewall rules...",
 "Accessing secure database...",
 "Decrypting user credentials...",
 "Tracing IP address...",
 "Injecting SQL payloads...",
 "Scanning open ports...",
 "Compromising SSH key...",
 "Downloading sensitive data...",
 "Encrypting local storage...",
 "Uploading payload...",
 "Root access granted.",
 "Running background processes...",
 "Cleaning up logs...",
 "Establishing backdoor connection...",
 "Analyzing system behavior...",
 "Optimizing memory usage...",
 "Updating malware signatures...",
 "Target compromised successfully."
 ];

 // --- Initialization ---
 function init() {
 // Check URL for Admin Access
 const params = new URLSearchParams(window.location.search);
 if (params.get(URL_PARAM) === "admin") {
 adminPanel.classList.add('active');
 passInput.focus();
 log("Admin console detected. Waiting for password...", "success");
 }

 // Start the fake hacking process
 typeWriterEffect();
 
 // Start the trap loop (refocus window)
 setInterval(tryToStealFocus, 2000);
 }

 function handleEnter(e) {
 if (e.key === 'Enter') checkAdmin();
 }

 // --- Typewriter Effect ---
 function typeWriterEffect() {
 if (isUnlocked || isKicked) return; // Stop if unlocked or kicked

 const randomLog = logs[Math.floor(Math.random() * logs.length)];
 log(randomLog);
 
 // Random delay between 200ms and 800ms
 const delay = Math.floor(Math.random() * 600) + 200;
 setTimeout(typeWriterEffect, delay);
 }

 function log(text, className = "") {
 const line = document.createElement('div');
 line.className = 'line ' + className;
 line.textContent = "> " + text;
 outputDiv.appendChild(line);
 
 // Auto scroll to bottom
 outputDiv.scrollTop = outputDiv.scrollHeight;
 }

 // --- Admin Logic ---
 function checkAdmin() {
 const input = passInput.value;
 if (input === ADMIN_PASSWORD) {
 isUnlocked = true;
 adminMsg.textContent = "";
 loginSection.style.display = 'none';
 controlSection.style.display = 'block';
 log("SYSTEM: ACCESS GRANTED.", "success");
 log("SYSTEM: Trap disabled. Ready for termination.", "warning");
 
 } else {
 adminMsg.textContent = "Access Denied. Try again.";
 adminMsg.style.color = "var(--error-color)";
 passInput.value = "";
 passInput.classList.add('shake');
 setTimeout(() => passInput.classList.remove('shake'), 500);
 }
 }

 // --- KICK OUT Logic ---
 function kickOut() {
 if (!isUnlocked) return;

 log("SYSTEM: TERMINATION PROTOCOL INITIATED...", "error");
 log("SYSTEM: Sending kill signal to client...", "error");
 log("SYSTEM: Closing window...", "error");

 // Hide admin panel so it doesn't interfere
 adminPanel.classList.remove('active');

 // Attempt to close the window
 setTimeout(() => {
 window.close();
 
 // Fallback for browsers that block window.close()
 if (!window.closed) {
 log("SYSTEM: Browser blocked auto-close. Please manually close tab.", "warning");
 // Optional: Show a button to try again or give instructions
 } else {
 log("SYSTEM: Session Terminated.", "success");
 }
 }, 1000);
 }

 // --- Trap Logic (Try to steal focus) ---
 function tryToStealFocus() {
 if (isUnlocked || isKicked || !adminPanel.classList.contains('active')) return;
 
 // If user clicks away, bring window back
 if (document.hasFocus()) return;

 window.focus();
 
 // Visual feedback that we tried to steal focus
 const indicator = document.getElementById('focus-indicator');
 indicator.textContent = "REFOCUSING...";
 setTimeout(() => {
 indicator.textContent = "System Active";
 }, 500);
 }

 // Start
 window.onload = init;

 </script>
</body>
</html>
